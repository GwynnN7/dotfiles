# Desktop
# Component names stay stable; package dependencies belong in PKGBUILDs.

[[components]]
name = "hyprland"
category = "wm"
default = true
packages = ["hyprland"]
post_deploy = ["if [ -n \"${HYPRLAND_INSTANCE_SIGNATURE:-}\" ]; then hyprctl reload >/dev/null; fi"]

[[components.files]]
src = "hypr"
dest = "$XDG_CONFIG_HOME/hypr"

[[components]]
name = "desktop portal"
category = "wm"
default = true
packages = ["xdg-desktop-portal-hyprland", "xdg-desktop-portal-gtk", "local:wormhole"]

[[components.files]]
src = "xdg-desktop-portal"
dest = "$XDG_CONFIG_HOME/xdg-desktop-portal"

[[components]]
name = "hyprutils"
category = "wm"
default = true
packages = ["hyprpicker", "hyprsunset", "hypridle", "brightnessctl"]

[[components]]
name = "hyprpm"
category = "wm"
default = false
ask = true
post_install = [
    "hyprpm add https://github.com/yayuuu/hyprland-scroll-overview",
    "hyprpm enable scrolloverview",
]
post_deploy = ["hyprpm update", "hyprpm reload"]

[[components.files]]
src = "repo:zjeffer/split-monitor-workspaces"
dest = "$XDG_CONFIG_HOME/hypr/plugins/split-monitor-workspaces"

[[components]]
name = "systemd"
category = "wm"
default = true
packages = ["uwsm", "app2unit"]

[[components.files]]
src = "uwsm"
dest = "$XDG_CONFIG_HOME/uwsm"

[[components.files]]
src = "environment.d"
dest = "$XDG_CONFIG_HOME/environment.d"
