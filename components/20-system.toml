# System

[[components]]
name = "system"
category = "system"
default = true
packages = ["gnome-keyring", "networkmanager", "bluez", "bluez-utils"]

[[components]]
name = "audio"
category = "system"
default = true
packages = [
    "pipewire",
    "pipewire-pulse",
    "pipewire-audio",
    "pipewire-alsa",
    "pipewire-jack",
    "wireplumber",
    "libpulse",
    "pwvucontrol",
    "playerctl",
    "pamixer",
]
[[components.files]]
src = "wireplumber"
dest = "$XDG_CONFIG_HOME/wireplumber"
[[components.files]]
src = "pipewire"
dest = "$XDG_CONFIG_HOME/pipewire"
environments = ["cykler"]

[[components]]
name = "pacseek"
category = "system"
default = true
packages = ["pacseek"]
[[components.files]]
src = "pacseek"
dest = "$XDG_CONFIG_HOME/pacseek"

[[components]]
name = "monitor"
category = "system"
default = true
packages = ["btop", "nvtop", "ncdu", "psmisc"]
post_deploy = ["killall -USR2 btop 2>/dev/null || true"]
[[components.files]]
src = "btop"
dest = "$XDG_CONFIG_HOME/btop"

[[components]]
name = "clipboard"
category = "system"
default = true
packages = ["wl-clipboard", "cliphist", "wtype"]

[[components]]
name = "tools"
category = "system"
default = true
packages = [
    "git",
    "curl",
    "wget",
    "rsync",
    "jq",
    "file",
    "fd",
    "zbar",
    "7zip",
    "unzip",
    "ffmpeg",
    "lazygit",
    "sshfs",
    "openssh",
    "trash-cli",
    "imagemagick",
    "libnotify",
    "xorg-xhost",
    "udiskie",
    "xdg-user-dirs",
]
[[components.files]]
src = "udiskie"
dest = "$XDG_CONFIG_HOME/udiskie"
post_deploy = ["xdg-user-dirs-update"]
[[components.files]]
src = "mimeapps.list"
dest = "$XDG_CONFIG_HOME/mimeapps.list"
[[components.files]]
src = "repo:GwynnN7/Wallpapers"
dest = "$HOME/Pictures/Wallpapers"
