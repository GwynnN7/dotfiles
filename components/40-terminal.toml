# Terminal

[[components]]
name = "foot"
category = "terminal"
default = true
packages = ["foot"]
[[components.files]]
src = "foot"
dest = "$XDG_CONFIG_HOME/foot"

[[components]]
name = "kitty"
category = "terminal"
default = false
packages = ["kitty"]

[[components]]
name = "fish"
category = "terminal"
default = true
packages = ["fish"]
[[components.files]]
src = "fish"
dest = "$XDG_CONFIG_HOME/fish"

[[components]]
name = "starship"
category = "terminal"
default = true
packages = ["starship"]
[[components.files]]
src = "starship.toml"
dest = "$XDG_CONFIG_HOME/starship.toml"

[[components]]
name = "fastfetch"
category = "terminal"
default = true
packages = ["fastfetch"]
[[components.files]]
src = "fastfetch"
dest = "$XDG_CONFIG_HOME/fastfetch"

[[components]]
name = "micro"
category = "terminal"
default = true
packages = ["micro"]
[[components.files]]
src = "micro"
dest = "$XDG_CONFIG_HOME/micro"
[[components.files]]
src = "applications/micro.desktop"
dest = "$XDG_DATA_HOME/applications/micro.desktop"

[[components]]
name = "nvim"
category = "terminal"
default = false
packages = ["neovim"]
[[components.files]]
src = "nvim/colors/caelestia.lua"
dest = "$XDG_CONFIG_HOME/nvim/colors/caelestia.lua"
environments = ["caelestia", "cykler"]
[[components.files]]
src = "nvim/lua/plugins/caelestia.lua"
dest = "$XDG_CONFIG_HOME/nvim/lua/plugins/caelestia.lua"
environments = ["caelestia", "cykler"]

[[components]]
name = "utilities"
category = "terminal"
default = true
packages = [
    "bat",
    "eza",
    "zoxide",
    "direnv",
    "ripgrep",
    "ydotool"
]