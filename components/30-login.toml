# Login
# Component names stay stable; package dependencies belong in PKGBUILDs.

[[components]]
name = "greetd"
category = "login"
default = false
packages = ["greetd", "greetd-tuigreet"]
post_install = [
    "sudo systemctl daemon-reload",
    "sudo systemctl disable display-manager",
    "sudo systemctl enable --now greetd",
]
post_deploy = ["sudo systemctl daemon-reload"]

[[components.files]]
src = "greetd/config.toml"
dest = "/etc/greetd/config.toml"
sudo = true

[[components.files]]
src = "greetd/greetd-switcher"
dest = "/usr/local/bin/greetd-switcher"
sudo = true

[[components]]
name = "sddm"
category = "login"
environments = ["caelestia", "cykler"]
default = false
packages = ["sddm", "caelestia-sddm-minimalistv2-git", "layer-shell-qt"]
post_install = [
    "sudo systemctl daemon-reload",
    "sudo systemctl disable display-manager",
    "sudo systemctl enable --now sddm",
]
post_deploy = [
    "sudo systemctl daemon-reload",
    "sudo /usr/share/sddm/themes/caelestia/scripts/sync.sh >/dev/null",
]

[[components.files]]
src = "sddm/caelestia.conf"
dest = "/etc/sddm.conf.d/caelestia.conf"
sudo = true

[[components.files]]
src = "sddm/sddm.lua"
dest = "/opt/hypr/sddm.lua"
sudo = true

[[components.files]]
src = "sddm/caelestia-sddm"
dest = "/etc/sudoers.d/caelestia-sddm"
sudo = true
