# Applications

[[components]]
name = "apps-core"
category = "apps"
default = true
packages = ["sone-bin", "zen-browser-bin", "telegram-desktop", "equibop"]
[[components.files]]
src = "applications/zen.desktop"
dest = "$XDG_DATA_HOME/applications/zen.desktop"

[[components]]
name = "astra"
category = "apps"
default = false
packages = ["local:flightdeck", "astra-airlock-git", "astra-foundry-git"]

[[components]]
name = "libreoffice"
category = "apps"
default = false
packages = ["libreoffice-fresh"]

[[components]]
name = "applications"
category = "apps"
default = false
packages = ["gimp", "vlc", "celluloid", "loupe", "evince", "file-roller", "gparted"]

[[components]]
name = "easyeffects"
category = "apps"
default = false
packages = ["easyeffects", "lsp-plugins-lv2", "calf"]
post_install = ["systemctl --user enable --now easyeffects 2>/dev/null || true"]

[[components]]
name = "kdeconnect"
category = "apps"
default = false
packages = ["kdeconnect", "local:kdeconnect"]
post_install = [
    "systemctl --user daemon-reload",
    "systemctl --user stop hypr-kdeconnect-portal.service 2>/dev/null || true",
    "systemctl --user restart xdg-desktop-portal",
]

[[components]]
name = "caelestia-connect"
category = "apps"
environments = ["caelestia", "cykler"]
default = false
packages = ["local:caelestia-connect", "local:kdeconnect"]
post_install = [
    "systemctl --user daemon-reload",
    "systemctl --user stop hypr-kdeconnect-portal.service 2>/dev/null || true",
    "systemctl --user restart xdg-desktop-portal",
    "sudo caelestia-connect-integrate --shell /etc/xdg/quickshell/caelestia/",
]

[[components]]
name = "openrgb"
category = "apps"
environments = ["caelestia", "cykler"]
devices = ["desktop"]
default = false
packages = ["openrgb", "caelestia-rgb-sync"]
post_install = [
    "rm -f $XDG_CONFIG_HOME/caelestia-rgb/config.toml 2>/dev/null || true",
    "caelestia-rgb-sync init",
    "caelestia-rgb-sync calibrate device",
    "caelestia-rgb-sync calibrate global",
]
post_deploy = ["caelestia-rgb-sync apply"]

[[components]]
name = "cortana"
category = "apps"
default = false
packages = ["dotnet-sdk"]
devices = ["desktop"]
post_install = ["systemctl --user daemon-reload", "systemctl --user enable cortana-desktop.service"]
post_deploy = [
    "systemctl --user daemon-reload",
    "systemctl --user try-restart cortana-desktop.service",
]
[[components.files]]
src = "repo:GwynnN7/Cortana"
dest = "$HOME/Projects/Cortana"
[[components.files]]
src = "cortana/Settings.json"
dest = "$XDG_CONFIG_HOME/cortana/Settings.json"
[[components.files]]
src = "cortana/cortana"
dest = "$XDG_BIN_HOME/cortana"
[[components.files]]
src = "cortana/cortana-desktop.service"
dest = "$XDG_CONFIG_SERVICE/cortana-desktop.service"
[[components.files]]
src = "cortana/sudoers_efibootmgr"
dest = "/etc/sudoers.d/efibootmgr"
sudo = true
check = false
