# Shells

[[components]]
name = "caelestia"
category = "shell"
environments = ["caelestia"]
default = true
packages = ["local:caelestia", "local:stowaway", "local:caelestia-cli"]
post_deploy = ["sh \"$WAYSYNC_REPO_DIR/scripts/waysync/restart-desktop-shell\""]
[[components.files]]
src = "caelestia"
dest = "$XDG_CONFIG_HOME/caelestia"
[[components.files]]
src = "desktop-shell/desktop-shell.service"
dest = "$XDG_CONFIG_SERVICE/desktop-shell.service"

