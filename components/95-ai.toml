# AI

[[components]]
name = "chatgpt"
category = "ai"
default = false
packages = [
    "chatgpt-desktop-bin",
]

[[components]]
name = "claude"
category = "ai"
default = false
packages = [
    "claude-desktop",
]

[[components]]
name = "lmstudio"
category = "ai"
default = false
packages = [
    "lmstudio-bin",
]

[[components]]
name = "unsloth"
category = "ai"
default = false
packages = [
    "unsloth-bin",
]

[[components]]
name = "rocm"
category = "ai"
default = false
packages = [
    "vulkan-radeon", "vulkan-icd-loader", "vulkan-headers", "vulkan-tools", "shaderc", "spirv-headers", "spirv-tools", "python", "python-pip", "ccache"
]
post_install = ["sh \"$WAYSYNC_REPO_DIR/scripts/ai/ai-install\" rocm"]
[[components.files]]
src = "ai/ai"
dest = "/usr/local/bin/ai"
sudo=true

[[components]]
name = "models"
category = "ai"
default = false
post_install = ["sh \"$WAYSYNC_REPO_DIR/scripts/ai/ai-install\" models"]

[[components]]
name = "stable-diffusion"
category = "ai"
default = false
packages = [
    "nodejs", "pnpm"
]
post_install = ["sh \"$WAYSYNC_REPO_DIR/scripts/ai/ai-install\" sdcpp"]

[[components]]
name = "comfyui"
category = "ai"
default = false
packages = [
     "python", "python-pip", "ccache"
]
post_install = ["sh \"$WAYSYNC_REPO_DIR/scripts/ai/ai-install\" comfyui"]

[[components]]
name = "llamacpp"
category = "ai"
default = false
packages = [
    "vulkan-radeon", "vulkan-icd-loader", "vulkan-headers", "vulkan-tools"
]
post_install = ["sh \"$WAYSYNC_REPO_DIR/scripts/ai/ai-install\" llamacpp"]

[[components]]
name = "llamacpp-hip"
category = "ai"
default = false
packages = [
    "shaderc", "spirv-headers", "spirv-tools"
]
post_install = ["sh \"$WAYSYNC_REPO_DIR/scripts/ai/ai-install\" llamacpp-hip"]

[[components]]
name = "transcribe-cpp"
category = "ai"
default = false
packages = [
    "ffmpeg"
]
post_install = ["sh \"$WAYSYNC_REPO_DIR/scripts/ai/ai-install\" whisp"]