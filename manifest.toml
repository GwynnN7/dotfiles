[environments]
available = ["caelestia", "noctalia"]

# ==============================================================================
# CATEGORY: shell
# ==============================================================================

[[components]]
name = "caelestia"
category = "shell"
environment = "caelestia"
default = true
packages = ["aur:quickshell-git", "local:shell"]
post_install = [
    "test -f ${XDG_STATE_HOME:-$HOME/.local/state}/caelestia/scheme.json || caelestia scheme set -n caelestia",
    "caelestia shell -k >/dev/null; sleep 1; caelestia shell -d >/dev/null",
]
post_deploy = [
    "caelestia shell -k >/dev/null; sleep 1; caelestia shell -d >/dev/null",
]
[[components.files]]
src = "caelestia"
dest = "$XDG_CONFIG_HOME/caelestia"

[[components]]
name = "noctalia"
category = "shell"
environment = "noctalia"
default = true
packages = ["noctalia"]

# ==============================================================================
# CATEGORY: wm
# ==============================================================================

[[components]]
name = "hypr"
category = "wm"
default = true
packages = [
    "hyprland",
    "xdg-desktop-portal-hyprland",
    "xdg-desktop-portal-gtk",
    "ttf-jetbrains-mono-nerd",
]
post_install = [
    "hyprctl reload >/dev/null",
    "hyprpm update",
    "hyprpm reload",
]
post_deploy = [
    "hyprctl reload >/dev/null",
    "hyprpm update",
    "hyprpm reload",
]
[[components.files]]
src = "hypr"
dest = "$XDG_CONFIG_HOME/hypr"
[[components.files]]
src = "xdg-desktop-portal"
dest = "$XDG_CONFIG_HOME/xdg-desktop-portal"

[[components]]
name = "hyprpm"
category = "wm"
default = false
packages = []
post_install = [
    "hyprpm purge-cache",
    "hyprpm reload",
    "hyprpm update",
    "hyprpm add https://github.com/zjeffer/split-monitor-workspaces || true",
    "hyprpm add https://github.com/yayuuu/hyprland-scroll-overview || true",
    "hyprpm add https://github.com/gfhdhytghd/hymission || true",
    "hyprpm enable split-monitor-workspaces || true",
    "hyprpm enable scrolloverview || true",
    "hyprpm enable hymission || true",
    "hyprpm reload",
]

[[components]]
name = "systemd"
category = "wm"
default = true
packages = ["uwsm", "app2unit"]
[[components.files]]
src = "uwsm"
dest = "$XDG_CONFIG_HOME/uwsm"
[[components.files]]
src = "environment.d"
dest = "$XDG_CONFIG_HOME/environment.d"

# ==============================================================================
# CATEGORY: system
# ==============================================================================

[[components]]
name = "system"
category = "system"
default = true
packages = ["gnome-keyring", "networkmanager", "bluez", "bluez-utils"]

[[components]]
name = "audio"
category = "system"
default = true
packages = [
    "pipewire",
    "pipewire-pulse",
    "pipewire-audio",
    "pipewire-alsa",
    "pipewire-jack",
    "wireplumber",
    "pwvucontrol",
    "playerctl",
]
[[components.files]]
src = "wireplumber"
dest = "$XDG_CONFIG_HOME/wireplumber"

[[components]]
name = "udiskie"
category = "system"
default = true
packages = ["udiskie"]
[[components.files]]
src = "udiskie"
dest = "$XDG_CONFIG_HOME/udiskie"

[[components]]
name = "clipboard"
category = "system"
default = true
packages = ["wl-clipboard", "cliphist", "wtype"]

# ==============================================================================
# CATEGORY: login
# ==============================================================================

[[components]]
name = "greetd"
category = "login"
default = false
packages = ["greetd", "greetd-tuigreet"]
post_install = [
    "sudo systemctl daemon-reload",
    "sudo systemctl enable --now greetd.service || true",
]
[[components.files]]
src = "greetd/config.toml"
dest = "/etc/greetd/config.toml"
sudo = true
[[components.files]]
src = "greetd/greetd-switcher"
dest = "/usr/local/bin/greetd-switcher"
sudo = true

[[components]]
name = "sddm"
category = "login"
default = false
packages = [
    "sddm",
    "caelestia-sddm-minimalistv2-git",
    "layer-shell-qt",
]
post_install = [
    "sudo systemctl daemon-reload",
    "sudo systemctl enable --now sddm.service || true",
    "sudo /usr/share/sddm/themes/caelestia/scripts/sync.sh >/dev/null",
]
post_deploy = [
    "sudo /usr/share/sddm/themes/caelestia/scripts/sync.sh >/dev/null",
]
[[components.files]]
src = "sddm/caelestia.conf"
dest = "/etc/sddm.conf.d/caelestia.conf"
sudo = true
environment = "caelestia"
[[components.files]]
src = "sddm/sddm.lua"
dest = "/opt/hypr/sddm.lua"
sudo = true
[[components.files]]
src = "sddm/caelestia-sddm"
dest = "/etc/sudoers.d/caelestia-sddm"
sudo = true
environment = "caelestia"

# ==============================================================================
# CATEGORY: terminal
# ==============================================================================

[[components]]
name = "foot"
category = "terminal"
default = true
packages = ["foot", "fish", "ttf-jetbrains-mono-nerd"]
[[components.files]]
