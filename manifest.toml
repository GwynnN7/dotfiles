[environments]
available = ["caelestia", "cykler", "serpantinum", "dms", "noctalia"]

# ==============================================================================
# CATEGORY: shell
# ==============================================================================

[[components]]
name = "caelestia"
category = "shell"
environment = "caelestia"
default = true
packages = ["aur:quickshell-git", "local:caelestia", "local:stowaway", "midnight-cli-git"]
post_install = [
    "systemctl --user daemon-reload",
    "systemctl --user restart desktop-shell.service",
]
post_deploy = [
    "systemctl --user daemon-reload",
    "systemctl --user restart desktop-shell.service",
]
[[components.files]]
src = "caelestia"
dest = "$XDG_CONFIG_HOME/caelestia"
[[components.files]]
src = "desktop-shell/desktop-shell.service"
dest = "$XDG_CONFIG_SERVICE/desktop-shell.service"

[[components]]
name = "cykler"
category = "shell"
environment = "cykler"
default = true
packages = ["aur:quickshell-git", "local:cykler", "local:caelestia-cli", "local:stowaway"]
post_install = [
    "systemctl --user daemon-reload",
    "systemctl --user restart desktop-shell.service",
]
post_deploy = [
    "systemctl --user daemon-reload",
    "systemctl --user restart desktop-shell.service",
]
[[components.files]]
src = "caelestia"
dest = "$XDG_CONFIG_HOME/caelestia"
[[components.files]]
src = "desktop-shell/desktop-shell.service"
dest = "$XDG_CONFIG_SERVICE/desktop-shell.service"

[[components]]
name = "serpantinum"
category = "shell"
environment = "serpantinum"
default = true
packages = [
    "aur:quickshell-git",
    "local:serpantinum"
]
post_install = [
    "systemctl --user daemon-reload",
    "systemctl --user restart desktop-shell.service",
]
post_deploy = [
    "systemctl --user daemon-reload",
    "systemctl --user restart desktop-shell.service",
]
[[components.files]]
src = "serpantinum"
dest = "$XDG_CONFIG_HOME/serpantinum"
[[components.files]]
src = "desktop-shell/desktop-shell.service"
dest = "$XDG_CONFIG_SERVICE/desktop-shell.service"

[[components]]
name = "dms"
category = "shell"
environment = "dms"
default = true
packages = ["dgop-git", "dsearch-git", "dms-shell-git"]
post_install = [
    "systemctl --user daemon-reload",
    "systemctl --user restart desktop-shell.service",
]
post_deploy = [
    "systemctl --user daemon-reload",
    "systemctl --user restart desktop-shell.service",
]
[[components.files]]
src = "dms"
dest = "$XDG_CONFIG_HOME/dms"
[[components.files]]
src = "desktop-shell/desktop-shell.service"
dest = "$XDG_CONFIG_SERVICE/desktop-shell.service"

[[components]]
name = "noctalia"
category = "shell"
environment = "noctalia"
default = true
packages = ["noctalia"]
post_install = [
    "systemctl --user daemon-reload",
    "systemctl --user restart desktop-shell.service",
]
post_deploy = [
    "systemctl --user daemon-reload",
    "systemctl --user restart desktop-shell.service",
]
[[components.files]]
src = "desktop-shell/desktop-shell.service"
dest = "$XDG_CONFIG_SERVICE/desktop-shell.service"

# ==============================================================================
# CATEGORY: wm
# ==============================================================================

[[components]]
name = "hyprland"
category = "wm"
default = true
packages = [
    "hyprland"
]
post_install = [
    "hyprctl reload >/dev/null",
    "hyprpm update",
    "hyprpm reload",
]
post_deploy = [
    "hyprctl reload >/dev/null",
    "hyprpm update",
    "hyprpm reload",
]
[[components.files]]
src = "hypr"
dest = "$XDG_CONFIG_HOME/hypr"

[[components]]
name = "desktop portal"
category = "wm"
default = true
packages = [
    "xdg-desktop-portal-hyprland",
    "xdg-desktop-portal-gtk",
    "local:wormhole",
]
[[components.files]]
src = "xdg-desktop-portal"
dest = "$XDG_CONFIG_HOME/xdg-desktop-portal"

[[components]]
name = "hyprutils"
category = "wm"
default = true
packages = [
    "hyprpicker",
    "hyprsunset",
    "hypridle",
]

[[components]]
name = "hyprpm"
category = "wm"
default = false
ask = true
packages = []
post_deploy = [
    "hyprpm purge-cache",
    "hyprpm reload",
    "hyprpm update",
    "hyprpm add https://github.com/zjeffer/split-monitor-workspaces",
    "hyprpm add https://github.com/yayuuu/hyprland-scroll-overview",
    "hyprpm add https://github.com/gfhdhytghd/hymission",
    "hyprpm enable split-monitor-workspaces",
    "hyprpm enable scrolloverview",
    "hyprpm enable hymission",
    "hyprpm reload",
]

[[components]]
name = "systemd"
category = "wm"
default = true
packages = ["uwsm", "app2unit"]
[[components.files]]
src = "uwsm"
dest = "$XDG_CONFIG_HOME/uwsm"
[[components.files]]
src = "environment.d"
dest = "$XDG_CONFIG_HOME/environment.d"

# ==============================================================================
# CATEGORY: system
# ==============================================================================

[[components]]
name = "system"
category = "system"
default = true
packages = ["gnome-keyring", "networkmanager", "bluez", "bluez-utils"]

[[components]]
name = "audio"
category = "system"
default = true
packages = [
    "pipewire",
    "pipewire-pulse",
    "pipewire-audio",
    "pipewire-alsa",
    "pipewire-jack",
    "wireplumber",
    "libpulse",
    "pwvucontrol",
    "playerctl",
    "pamixer"
]
[[components.files]]
src = "wireplumber"
dest = "$XDG_CONFIG_HOME/wireplumber"
[[components.files]]
src = "pipewire"
dest = "$XDG_CONFIG_HOME/pipewire"
environment = "cykler"

[[components]]
name = "udiskie"
category = "system"
default = true
packages = ["udiskie"]
[[components.files]]
src = "udiskie"
dest = "$XDG_CONFIG_HOME/udiskie"

[[components]]
name = "clipboard"
category = "system"
default = true
packages = ["wl-clipboard", "cliphist", "wtype"]

# ==============================================================================
# CATEGORY: login
# ==============================================================================

[[components]]
name = "greetd"
category = "login"
default = false
packages = ["greetd", "greetd-tuigreet"]
post_install = [
    "sudo systemctl daemon-reload",
    "sudo systemctl disable display-manager",
    "sudo systemctl enable --now greetd",
]
post_deploy = [
    "sudo systemctl daemon-reload",
    "sudo systemctl disable display-manager",
    "sudo systemctl enable --now greetd",
]
[[components.files]]
src = "greetd/config.toml"
dest = "/etc/greetd/config.toml"
sudo = true
[[components.files]]
src = "greetd/greetd-switcher"
dest = "/usr/local/bin/greetd-switcher"
sudo = true

[[components]]
name = "sddm"
category = "login"
default = false
environments = ["caelestia", "cykler"]
packages = [
    "sddm",
    "caelestia-sddm-minimalistv2-git",
    "layer-shell-qt",
]
post_install = [
    "sudo systemctl daemon-reload",
    "sudo systemctl disable display-manager",
    "sudo systemctl enable --now sddm",
    "sudo /usr/share/sddm/themes/caelestia/scripts/sync.sh >/dev/null",
]
post_deploy = [
    "sudo systemctl daemon-reload",
    "sudo systemctl disable display-manager",
    "sudo systemctl enable --now sddm",
    "sudo /usr/share/sddm/themes/caelestia/scripts/sync.sh >/dev/null",
]
[[components.files]]
src = "sddm/caelestia.conf"
dest = "/etc/sddm.conf.d/caelestia.conf"
sudo = true
[[components.files]]
src = "sddm/sddm.lua"
dest = "/opt/hypr/sddm.lua"
sudo = true
[[components.files]]
src = "sddm/caelestia-sddm"
dest = "/etc/sudoers.d/caelestia-sddm"
sudo = true

