dest = "$XDG_DATA_HOME/applications/micro.desktop"

[[components]]
name = "nvim"
category = "terminal"
default = false
packages = ["neovim"]
[[components.files]]
src = "nvim/colors/caelestia.lua"
dest = "$XDG_CONFIG_HOME/nvim/colors/caelestia.lua"
environment = "caelestia"
[[components.files]]
src = "nvim/lua/plugins/caelestia.lua"
dest = "$XDG_CONFIG_HOME/nvim/lua/plugins/caelestia.lua"
environment = "caelestia"

[[components]]
name = "yazi"
category = "terminal"
default = true
packages = ["yazi", "7zip", "ffmpeg"]
[[components.files]]
src = "yazi"
dest = "$XDG_CONFIG_HOME/yazi"

[[components]]
name = "pacseek"
category = "terminal"
default = true
packages = ["pacseek"]
[[components.files]]
src = "pacseek"
dest = "$XDG_CONFIG_HOME/pacseek"

[[components]]
name = "tools"
category = "terminal"
default = true
packages = [
    "git",
    "curl",
    "trash-cli",
    "jq",
    "lazygit",
    "bat",
    "ripgrep",
    "ydotool",
    "hyprpicker",
    "hyprsunset",
    "hypridle",
    "xdg-user-dirs",
]
post_install = ["xdg-user-dirs-update"]
post_deploy = ["xdg-user-dirs-update"]
[[components.files]]
src = "repo:GwynnN7/Wallpaper"
dest = "$HOME/Pictures/Wallpaper"

# ==============================================================================
# CATEGORY: theming
# ==============================================================================

[[components]]
name = "gtk"
category = "theming"
default = true
packages = ["adw-gtk-theme", "papirus-icon-theme", "papirus-folders"]

[[components]]
name = "qt"
category = "theming"
default = true
packages = [
    "qtengine-git",
    "frameworkintegration",
    "darkly-bin",
    "papirus-icon-theme",
    "papirus-folders",
]

[[components]]
name = "fonts"
category = "theming"
default = true
packages = ["noto-fonts", "noto-fonts-cjk", "noto-fonts-emoji"]

[[components]]
name = "plymouth"
category = "system"
default = false
packages = ["plymouth", "plymouth-theme-darth-vader-git"]
post_install = [
    "sudo plymouth-set-default-theme -R darth_vader",
]

# ==============================================================================
# CATEGORY: gaming
# ==============================================================================

[[components]]
name = "gaming-core"
category = "gaming"
default = true
packages = ["cachyos-gaming-applications"]
post_install = [
	"flatpak install -y net.retrodeck.retrodeck"
]
[[components.files]]
src = "gaming/scx_loader.toml"
dest = "/etc/scx_loader/config.toml"
sudo = true
[[components.files]]
src = "gaming/gaming"
dest = "/etc/sudoers.d/gaming"
sudo = true

[[components]]
name = "gamemode"
category = "gaming"
default = false
packages = ["gamemode"]

[[components]]
name = "mangohud"
category = "gaming"
default = true
packages = []
[[components.files]]
src = "mangohud"
dest = "$XDG_CONFIG_HOME/MangoHud"

[[components]]
name = "hyprland-booster"
category = "gaming"
default = true
packages = ["hyprland-focused-booster"]
[[components.files]]
src = "gaming/booster"
dest = "/usr/local/bin/booster"
sudo = true
[[components.files]]
src = "gaming/focus-booster-override.conf"
dest = "$XDG_CONFIG_HOME/systemd/user/hyprland-focused-booster.service.d/override.conf"

[[components]]
name = "steamos-session"
category = "gaming"
default = true
packages = ["gamescope-session-cachyos"]
post_install = [
    "steamos-session-select persistent"
]
[[components.files]]
src = "steamos/steam-set-session"
dest = "/usr/lib/steamos/steam-set-session"
sudo = true
[[components.files]]
src = "steamos/steamos-session-select"
dest = "/usr/bin/steamos-session-select"
sudo = true

[[components]]
name = "decky-loader"
category = "gaming"
default = true
packages = []
post_install = [
    "curl -L https://github.com/SteamDeckHomebrew/decky-installer/releases/latest/download/install_release.sh | sh",
]
[[components.files]]
src = "steamos/homebrew"
dest = "$HOME/homebrew"
sudo = true
[[components.files]]
src = "steamos/dlo"
dest = "$HOME/.dlo"

[[components]]
name = "lact"
category = "gaming"
default = true
packages = ["lact"]
[[components.files]]
src = "gaming/lact/lact.yaml"
dest = "/etc/lact/config.yaml"
sudo = true
[[components.files]]
src = "gaming/lact/config.yaml"
dest = "$XDG_CONFIG_HOME/lact/config.yaml"

[[components]]
name = "retrodeck-bios"
category = "gaming"
default = false
packages = ["flatpak"]
post_install = [
    "flatpak install -y net.retrodeck.retrodeck",
    "flatpak override --user --talk-name=org.freedesktop.Flatpak net.retrodeck.retrodeck",
    "mkdir -p $HOME/Games/Retrodeck/Switch",
    "mkdir -p $HOME/Games/Retrodeck/retrodeck/roms/apps",
    "curl -fsSL https://raw.githubusercontent.com/Abdess/retrobios/main/install.sh | sh -s -- --platform retrodeck --dest $HOME/Games/Retrodeck/retrodeck/bios",
]
[[components.files]]
src = "retrodeck/es_systems.xml"
dest = "$HOME/.var/app/net.retrodeck.retrodeck/config/ES-DE/custom_systems/es_systems.xml"
[[components.files]]
src = "retrodeck/Switch.sh"
dest = "$HOME/Games/Retrodeck/retrodeck/roms/apps/Switch.sh"

