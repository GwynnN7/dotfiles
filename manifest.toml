[[components]]
name = "openrgb"
category = "desktop"
environment = "caelestia"
default = false
packages = ["openrgb-git", "caelestia-rgb-sync"]
post_install = [
    "rm -f $XDG_CONFIG_HOME/caelestia-rgb/config.toml 2>/dev/null || true",
    "caelestia-rgb-sync init",
    "caelestia-rgb-sync calibrate device",
    "caelestia-rgb-sync calibrate global",
]
post_deploy = [
    "caelestia-rgb-sync apply",
]

