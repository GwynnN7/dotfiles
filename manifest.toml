category = "terminal"
default = true
packages = ["btop", "nvtop", "ncdu"]
post_install = ["killall -USR2 btop 2>/dev/null || true"]
post_deploy = ["killall -USR2 btop 2>/dev/null || true"]
[[components.files]]
src = "btop"
dest = "$XDG_CONFIG_HOME/btop"

[[components]]
name = "micro"
category = "terminal"
default = true
packages = ["micro"]
[[components.files]]
src = "micro"
